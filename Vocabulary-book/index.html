<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F4F1EA; font-family: 'Nunito', sans-serif; }
  a.lang-card { text-decoration:none; }
  a.lang-card:hover { filter: brightness(0.97); }
</style>
</head>
<body>

<div style="max-width:760px;margin:0 auto;padding:64px 32px 96px;">

  <div style="text-align:center;padding:8px 0 44px;">
    <div style="display:inline-block;background:#0E7C86;color:#FFF6D8;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.5px;padding:6px 18px;border-radius:999px;text-transform:uppercase;">Themed Word Sets</div>
    <h1 style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:#1B4B4F;margin:18px 0 8px;line-height:1.05;">Vocabulary Book</h1>
    <div style="font-family:'Nunito',sans-serif;font-weight:600;font-size:17px;color:#5C4A00;max-width:520px;margin:0 auto;">Choose a language to browse its vocabulary batches.</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
    <a class="lang-card" href="English/index.html" style="background:#fff;border:2px solid #DCEEE2;border-radius:16px;padding:28px 20px;text-align:center;">
      <div style="font-size:38px;margin-bottom:8px;">🇬🇧</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:#1B4B4F;">English</div>
      <div style="font-family:'Nunito',sans-serif;font-size:13px;color:#9A9483;margin-top:4px;">A1–C2 · 1 batch</div>
    </a>
  </div>

</div>
</body>
</html>
