document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

order:1px solid #E4E4E4;\">Pays pluriel<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">aux<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">aux Philippines<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">Personne<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">chez<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">chez ma sœur<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h3 style=\"font-family:'Baloo 2',sans-serif;font-size:17px;color:#1B4B4F;margin:14px 0 8px;\">Exceptions courantes<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:0 0 16px;font-size:13.5px;\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#8B5FE0;color:#fff;\"><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #8B5FE0;\">Cas<\u002Fsc-raw-th><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #8B5FE0;\">Règle<\u002Fsc-raw-th><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #8B5FE0;\">Exemple<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">Masculin mais commence par une voyelle<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">en (pas au)<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">en Afghanistan<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#FBF9F3;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">Petites îles, sans article<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à (pas en/au)<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à Cuba, à Madagascar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">Ville avec son propre article<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à quand même<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à La Haye, au Caire*<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h3 style=\"font-family:'Baloo 2',sans-serif;font-size:17px;color:#1B4B4F;margin:14px 0 8px;\">à + article défini (lieux génériques)<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:0 0 8px;font-size:13.5px;\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#4C7BF5;color:#fff;\"><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #4C7BF5;\">à + article<\u002Fsc-raw-th><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #4C7BF5;\">Forme contractée<\u002Fsc-raw-th><sc-raw-th style=\"padding:7px 10px;text-align:left;border:1px solid #4C7BF5;\">Exemple<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à + le<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">au<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">au cinéma<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#FBF9F3;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à + les<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">aux<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">aux toilettes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à + la / l'<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">pas de changement<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 10px;border:1px solid #E4E4E4;\">à la banque, à l'école<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"font-size:12.5px;color:#9A9483;margin:0 0 20px;\">*« Le Caire » garde son article après « au » — un rare cas double.<\u002Fdiv>\n\n  <h2 style=\"font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:700;color:#0E7C86;display:flex;align-items:center;gap:10px;margin:24px 0 6px;border-bottom:3px solid #FFE29A;padding-bottom:6px;break-before:page;\">✏️ 3. Exercices pratiques<\u002Fh2>\n  <p style=\"font-size:13.5px;color:#9A9483;margin:0 0 16px;\">18 exercices répartis sur les six niveaux du CECR — trois par niveau, en difficulté croissante. Vérifiez chaque réponse ou révélez la solution.<\u002Fp>\n\n  <div id=\"gb-exercises\"><\u002Fdiv>\n\n  <div class=\"gb-noprint\" style=\"text-align:center;margin-top:24px;\">\n    <button id=\"gb-reset\" style=\"font-family:'Nunito',sans-serif;background:#fff;color:#B23A3A;border:1.5px solid #E3B3B3;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;\">Réinitialiser cette page<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LEVELS = {\n  A1: { badge:'#4CAF7D', border:'#DCEEE2', bg:'#FAFCFB', name:'Débutant' },\n  A2: { badge:'#3AA6A6', border:'#D9EFEF', bg:'#F9FDFD', name:'Élémentaire' },\n  B1: { badge:'#4C7BF5', border:'#DCE5FB', bg:'#F9FAFE', name:'Intermédiaire' },\n  B2: { badge:'#8B5FE0', border:'#E9E0FB', bg:'#FBF9FE', name:'Intermédiaire avancé' },\n  C1: { badge:'#F2994A', border:'#FBE6D2', bg:'#FFFAF4', name:'Avancé' },\n  C2: { badge:'#E8555F', border:'#FADADD', bg:'#FFF9FA', name:'Maîtrise' },\n};\nconst STORAGE_KEY = 'grammar-fr-prepositions-lieu-v1';\n\nfunction norm(s) {\n  return (s || '').toString().trim().toLowerCase()\n    .replace(/['’]/g, \"'\")\n    .replace(/\\s+/g, ' ')\n    .replace(/[.!?]+$/g, '');\n}\n\nconst EXERCISES = [\n  { id:'ex1', level:'A1', type:'fill', label:'Complétez le blanc.', prompt:'Elle habite {{b}} Paris.', answers:['à'],\n    explain:'📖 Ville → « à », sans article. 💡 « à » + ville = presque toujours, sauf rares exceptions comme La Haye.' },\n  { id:'ex2', level:'A1', type:'fill', label:'Complétez le blanc.', prompt:'Nous allons {{b}} France cet été.', answers:['en'],\n    explain:'📖 Pays féminin → « en ». 💡 La plupart des pays en « -e » sont féminins : la France, l\\'Italie.' },\n  { id:'ex3', level:'A1', type:'mc', label:'Choix multiple : choisissez la bonne préposition.', prompt:'Il travaille {{b}} Japon.', options:['à','en','au','chez'], answer:'au',\n    explain:'📖 Pays masculin → « au ». 💡 « le Japon » → au Japon.' },\n\n  { id:'ex4', level:'A2', type:'fill', label:'Complétez le blanc.', prompt:'Je vais {{b}} le médecin demain.', answers:['chez'],\n    explain:'📖 Personne → « chez ». 💡 « chez » ne s\\'utilise jamais pour un pays ou une ville.' },\n  { id:'ex5', level:'A2', type:'fill', label:'Complétez le blanc.', prompt:'Ils passent leurs vacances {{b}} États-Unis.', answers:['aux'],\n    explain:'📖 Pays pluriel → « aux ». 💡 « les États-Unis » → aux États-Unis.' },\n  { id:'ex6', level:'A2', type:'mc', label:'Choix multiple : choisissez la bonne préposition.', prompt:'Elle vit {{b}} Belgique.', options:['en','au','à','chez'], answer:'en',\n    explain:'📖 Pays féminin → « en ». 💡 « la Belgique » → en Belgique.' },\n\n  { id:'ex7', level:'B1', type:'fill', label:'Complétez le blanc (contraction).', prompt:'On se retrouve {{b}} cinéma à 20h.', answers:['au'],\n    explain:'📖 « à » + « le cinéma » se contracte en « au ». 💡 à + le = au, toujours.' },\n  { id:'ex8', level:'B1', type:'fill', label:'Complétez le blanc (exception).', prompt:'Mon frère habite {{b}} Iran.', answers:['en'],\n    explain:'📖 « l\\'Iran » est masculin, mais commence par une voyelle → « en » quand même. 💡 Voyelle au début du nom = en, même si le pays est masculin.' },\n  { id:'ex9', level:'B1', type:'correct', label:\"Correction d'erreur : réécrivez la phrase correctement.\", original:'Je vais à le supermarché.', answers:['Je vais au supermarché.'],\n    explain:'📖 « à le » n\\'existe pas en français : ça se contracte toujours en « au ». 💡 Réflexe : jamais « à le », jamais « à les ».' },\n\n  { id:'ex10', level:'B2', type:'reorder', label:\"Remettez les mots dans l'ordre pour former une phrase correcte.\", tokens:['Je','passe','mes','vacances','à','Cuba'], answers:['Je passe mes vacances à Cuba.'],\n    explain:'📖 Cuba est une petite île, sans article → « à Cuba ». 💡 Comme Madagascar, Cuba n\\'a pas d\\'article défini.' },\n  { id:'ex11', level:'B2', type:'fill', label:'Complétez le blanc (exception).', prompt:'Elle est née {{b}} Madagascar.', answers:['à'],\n    explain:'📖 Petites îles sans article → « à ». 💡 Exception à retenir par cœur : à Cuba, à Madagascar, à Chypre.' },\n  { id:'ex12', level:'B2', type:'mc', label:'Choix multiple : choisissez la bonne préposition.', prompt:'Nous dînons {{b}} nos amis ce soir.', options:['chez','à','en','au'], answer:'chez',\n    explain:'📖 Personne(s) → « chez ». 💡 « chez » + pronom/nom de personne, jamais + lieu.' },\n\n  { id:'ex13', level:'C1', type:'fill', label:'Complétez le blanc.', prompt:'Le sommet aura lieu {{b}} Pays-Bas en mai.', answers:['aux'],\n    explain:'📖 « les Pays-Bas » est pluriel → « aux ». 💡 Un nom de pays pluriel prend toujours « aux ».' },\n  { id:'ex14', level:'C1', type:'correct', label:\"Correction d'erreur : réécrivez la phrase correctement.\", original:'Elle travaille en Canada depuis deux ans.', answers:['Elle travaille au Canada depuis deux ans.'],\n    explain:'📖 « le Canada » est masculin → « au », pas « en ». 💡 « en » est réservé au féminin ou aux voyelles initiales.' },\n  { id:'ex15', level:'C1', type:'reorder', label:\"Remettez les mots dans l'ordre pour former une phrase correcte.\", tokens:['Il','passe','son','été','chez','ses','grands-parents'], answers:['Il passe son été chez ses grands-parents.'],\n    explain:'📖 Les grands-parents sont des personnes → « chez ». 💡 Le lieu physique (leur maison) ne compte pas, seule la personne compte.' },\n\n  { id:'ex16', level:'C2', type:'fill', label:'Complétez le blanc (ville avec son propre article).', prompt:'Le procès s\\'est ouvert {{b}} La Haye.', answers:['à'],\n    explain:'📖 Les villes gardent « à » même quand leur nom contient un article, comme « La Haye ». 💡 Cas rare mais fréquent en actualité/diplomatie.' },\n  { id:'ex17', level:'C2', type:'fill', label:'Complétez le blanc (pays pluriel).', prompt:'Cette entreprise est implantée {{b}} Émirats arabes unis.', answers:['aux'],\n    explain:'📖 Nom de pays pluriel → « aux », quelle que soit la première lettre. 💡 Le pluriel prime toujours sur la règle de la voyelle.' },\n  { id:'ex18', level:'C2', type:'mc', label:'Choix multiple : choisissez la bonne paire de prépositions.', prompt:'Il a grandi {{b1}} Cuba puis {{b2}} États-Unis.', options:['à … aux','en … au','au … en','chez … à'], answer:'à … aux',\n    explain:'📖 Cuba (île sans article) → « à » ; les États-Unis (pluriel) → « aux ». 💡 Deux règles différentes dans une même phrase — traitez chaque lieu séparément.' }\n];\n\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.store = this.loadStore();\n    this.waitForMount();\n  }\n\n  waitForMount() {\n    const container = document.getElementById('gb-exercises');\n    const resetBtn = document.getElementById('gb-reset');\n    if (!container || !resetBtn) {\n      requestAnimationFrame(() => this.waitForMount());\n      return;\n    }\n    this.buildExercises();\n    this.updateProgress();\n    resetBtn.addEventListener('click', () => this.resetPage());\n  }\n\n  loadStore() {\n    try {\n      const raw = localStorage.getItem(STORAGE_KEY);\n      return raw ? JSON.parse(raw) : { answers: {}, results: {}, reorder: {} };\n    } catch (e) { return { answers: {}, results: {}, reorder: {} }; }\n  }\n\n  saveStore() {\n    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.store)); } catch (e) {}\n  }\n\n  updateProgress() {\n    const done = EXERCISES.filter(ex => this.store.results[ex.id] === true).length;\n    document.getElementById('gb-progress').textContent = done + ' / 18 exercices terminés';\n  }\n\n  resetPage() {\n    if (!confirm('Réinitialiser toutes vos réponses et scores sur cette page ?')) return;\n    localStorage.removeItem(STORAGE_KEY);\n    this.store = { answers: {}, results: {}, reorder: {} };\n    this.buildExercises();\n    this.updateProgress();\n  }\n\n  markResult(id, correct) {\n    this.store.results[id] = correct;\n    this.saveStore();\n    this.updateProgress();\n  }\n\n  buildExercises() {\n    const container = document.getElementById('gb-exercises');\n    container.innerHTML = '';\n    let currentLevel = null;\n    EXERCISES.forEach((ex, i) => {\n      if (ex.level !== currentLevel) {\n        currentLevel = ex.level;\n        const info = LEVELS[currentLevel];\n        const badge = document.createElement('div');\n        badge.style.cssText = 'display:inline-block;background:' + info.badge + ';color:#fff;font-family:\\'Baloo 2\\',sans-serif;font-weight:700;font-size:15px;padding:5px 16px;border-radius:8px;margin:10px 0 10px;';\n        if (currentLevel === 'C1') badge.style.breakBefore = 'page';\n        badge.textContent = 'NIVEAU ' + currentLevel + ' · ' + info.name;\n        container.appendChild(badge);\n      }\n      container.appendChild(this.renderExercise(ex, i + 1));\n    });\n  }\n\n  cardShell(ex, num, bodyHtml) {\n    const info = LEVELS[ex.level];\n    const div = document.createElement('div');\n    div.style.cssText = 'border:2px solid ' + info.border + ';border-radius:14px;padding:16px 18px;margin:0 0 14px;background:' + info.bg + ';break-inside:avoid;';\n    div.innerHTML =\n      '<div style=\"font-family:\\'Baloo 2\\',sans-serif;font-weight:700;color:#1B4B4F;margin-bottom:10px;\">Exercice ' + num + ' — ' + ex.label + '<\u002Fdiv>' +\n      bodyHtml +\n      '<div class=\"gb-noprint\" style=\"display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;\">' +\n        '<button class=\"gb-check-btn\" data-id=\"' + ex.id + '\" style=\"font-family:\\'Nunito\\',sans-serif;background:#0E7C86;color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;\">Vérifier<\u002Fbutton>' +\n        '<button class=\"gb-reveal-btn\" data-id=\"' + ex.id + '\" style=\"font-family:\\'Nunito\\',sans-serif;background:#fff;color:#1B4B4F;border:1px solid #ddd;border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer;min-height:40px;\">Voir la réponse<\u002Fbutton>' +\n      '<\u002Fdiv>' +\n      '<div class=\"gb-feedback\" data-id=\"' + ex.id + '\" style=\"margin-top:10px;font-size:14px;\"><\u002Fdiv>';\n    setTimeout(() => this.wireExercise(div, ex), 0);\n    return div;\n  }\n\n  renderExercise(ex, num) {\n    if (ex.type === 'fill') return this.renderFill(ex, num);\n    if (ex.type === 'mc') return this.renderMC(ex, num);\n    if (ex.type === 'reorder') return this.renderReorder(ex, num);\n    if (ex.type === 'correct') return this.renderCorrect(ex, num);\n  }\n\n  renderFill(ex, num) {\n    const savedRaw = this.store.answers[ex.id];\n    const saved = Array.isArray(savedRaw) ? savedRaw : (savedRaw ? [savedRaw] : []);\n    let idx = 0;\n    const promptHtml = ex.prompt.replace(/\\{\\{b\\d?\\}\\}/g, () => {\n      const w = Math.max(3, Math.max(...ex.answers.map(a => a.length))) + 2;\n      const val = saved[idx] || '';\n      idx++;\n      return '<input type=\"text\" class=\"gb-input gb-fill-input\" data-id=\"' + ex.id + '\" data-idx=\"' + (idx - 1) + '\" placeholder=\"…\" value=\"' + val.replace(/\"/g, '&quot;') + '\" style=\"width:' + w + 'ch;font-size:15px;padding:5px 8px;border:1.5px solid #ddd;border-radius:8px;text-align:center;font-family:\\'Nunito\\',sans-serif;\">';\n    });\n    const body = '<div style=\"font-size:15.5px;color:#2B2B2B;\">' + promptHtml + '<\u002Fdiv>';\n    const card = this.cardShell(ex, num, body);\n    const result = this.store.results[ex.id];\n    if (result !== undefined) this.paintFillResult(card, ex, result === true);\n    return card;\n  }\n\n  renderMC(ex, num) {\n    const promptHtml = ex.prompt.replace('{{b}}', '<span style=\"color:#0E7C86;font-weight:700;\">___<\u002Fspan>');\n    let optsHtml = '<div class=\"gb-mc-row\" style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;\">';\n    ex.options.forEach(opt => {\n      optsHtml += '<button class=\"gb-mc-btn\" data-id=\"' + ex.id + '\" data-value=\"' + opt.replace(/\"/g, '&quot;') + '\" style=\"font-family:\\'Nunito\\',sans-serif;background:#fff;border:1.5px solid #ddd;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;min-height:44px;\">' + opt + '<\u002Fbutton>';\n    });\n    optsHtml += '<\u002Fdiv>';\n    const body = '<div style=\"font-size:15.5px;color:#2B2B2B;\">' + promptHtml + '<\u002Fdiv>' + optsHtml;\n    const card = this.cardShell(ex, num, body);\n    const saved = this.store.answers[ex.id];\n    if (saved) this.highlightMC(card, ex, saved);\n    const result = this.store.results[ex.id];\n    if (result !== undefined) this.paintMCResult(card, ex, result === true, saved);\n    return card;\n  }\n\n  renderReorder(ex, num) {\n    const savedOrder = this.store.reorder[ex.id] || [];\n    const remaining = ex.tokens.slice();\n    savedOrder.forEach(t => { const i = remaining.indexOf(t); if (i > -1) remaining.splice(i, 1); });\n    const body =\n      '<div class=\"gb-build-area\" data-id=\"' + ex.id + '\" style=\"min-height:44px;border:1.5px dashed #ccc;border-radius:10px;padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;background:#fff;\">' +\n        savedOrder.map(t => '<button class=\"gb-token gb-token-used\" data-id=\"' + ex.id + '\" data-word=\"' + t.replace(/\"/g, '&quot;') + '\" style=\"font-family:\\'Nunito\\',sans-serif;background:#fff;border:1.5px solid #0E7C86;color:#0E7C86;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:40px;\">' + t + '<\u002Fbutton>').join('') +\n      '<\u002Fdiv>' +\n      '<div class=\"gb-word-bank\" data-id=\"' + ex.id + '\" style=\"display:flex;gap:6px;flex-wrap:wrap;\">' +\n        remaining.map(t => '<button class=\"gb-token gb-token-bank\" data-id=\"' + ex.id + '\" data-word=\"' + t.replace(/\"/g, '&quot;') + '\" style=\"font-family:\\'Nunito\\',sans-serif;background:#fff;border:1.5px solid #ddd;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:40px;\">' + t + '<\u002Fbutton>').join('') +\n      '<\u002Fdiv>' +\n      '<div style=\"font-size:12px;color:#9A9483;margin-top:6px;\">Touchez les mots dans l\\'ordre pour construire la phrase. Touchez un mot de la phrase pour le retirer.<\u002Fdiv>';\n    return this.cardShell(ex, num, body);\n  }\n\n  renderCorrect(ex, num) {\n    const saved = this.store.answers[ex.id] || '';\n    const body =\n      '<div style=\"font-size:14.5px;color:#2B2B2B;margin-bottom:8px;\">Réécrivez correctement : <em>« ' + ex.original + ' »<\u002Fem><\u002Fdiv>' +\n      '<input type=\"text\" class=\"gb-input gb-correct-input\" data-id=\"' + ex.id + '\" placeholder=\"…\" value=\"' + saved.replace(/\"/g, '&quot;') + '\" style=\"width:100%;box-sizing:border-box;font-size:15px;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-family:\\'Nunito\\',sans-serif;\">';\n    const card = this.cardShell(ex, num, body);\n    const result = this.store.results[ex.id];\n    if (result !== undefined) this.paintFillResult(card, ex, result === true);\n    return card;\n  }\n\n  wireExercise(card, ex) {\n    const checkBtn = card.querySelector('.gb-check-btn');\n    const revealBtn = card.querySelector('.gb-reveal-btn');\n    checkBtn.addEventListener('click', () => this.checkExercise(card, ex));\n    revealBtn.addEventListener('click', () => this.revealExercise(card, ex));\n\n    if (ex.type === 'fill' || ex.type === 'correct') {\n      card.querySelectorAll('input').forEach(input => {\n        input.addEventListener('input', () => {\n          if (ex.type === 'correct') {\n            this.store.answers[ex.id] = input.value;\n          } else {\n            const idx = parseInt(input.dataset.idx, 10);\n            const arr = Array.isArray(this.store.answers[ex.id]) ? this.store.answers[ex.id].slice() : [];\n            arr[idx] = input.value;\n            this.store.answers[ex.id] = arr;\n          }\n          this.saveStore();\n        });\n      });\n    }\n\n    if (ex.type === 'mc') {\n      card.querySelectorAll('.gb-mc-btn').forEach(btn => {\n        btn.addEventListener('click', () => {\n          this.store.answers[ex.id] = btn.dataset.value;\n          this.saveStore();\n          this.highlightMC(card, ex, btn.dataset.value);\n        });\n      });\n    }\n\n    if (ex.type === 'reorder') {\n      card.querySelectorAll('.gb-token-bank').forEach(btn => {\n        btn.addEventListener('click', () => this.moveToken(ex, btn.dataset.word, true));\n      });\n      card.querySelectorAll('.gb-token-used').forEach(btn => {\n        btn.addEventListener('click', () => this.moveToken(ex, btn.dataset.word, false));\n      });\n    }\n  }\n\n  moveToken(ex, word, toUsed) {\n    const order = (this.store.reorder[ex.id] || []).slice();\n    if (toUsed) {\n      if (order.indexOf(word) === -1) order.push(word);\n    } else {\n      const idx = order.indexOf(word);\n      if (idx > -1) order.splice(idx, 1);\n    }\n    this.store.reorder[ex.id] = order;\n    this.saveStore();\n    this.buildExercises();\n  }\n\n  highlightMC(card, ex, value) {\n    card.querySelectorAll('.gb-mc-btn').forEach(btn => {\n      const selected = btn.dataset.value === value;\n      btn.style.background = selected ? '#0E7C86' : '#fff';\n      btn.style.color = selected ? '#fff' : '#1B4B4F';\n      btn.style.borderColor = selected ? '#0E7C86' : '#ddd';\n    });\n  }\n\n  paintMCResult(card, ex, correct, value) {\n    card.querySelectorAll('.gb-mc-btn').forEach(btn => {\n      if (btn.dataset.value === value) {\n        btn.style.background = correct ? '#E8F5E9' : '#FDECEA';\n        btn.style.color = correct ? '#2E7D32' : '#C62828';\n        btn.style.borderColor = correct ? '#66BB6A' : '#E57373';\n      }\n    });\n  }\n\n  paintFillResult(card, ex, correct) {\n    card.querySelectorAll('input').forEach(input => {\n      input.style.background = correct ? '#E8F5E9' : '#FDECEA';\n      input.style.borderColor = correct ? '#66BB6A' : '#E57373';\n      input.style.color = correct ? '#2E7D32' : '#C62828';\n    });\n  }\n\n  getUserAnswer(ex) {\n    if (ex.type === 'mc') return this.store.answers[ex.id] || '';\n    if (ex.type === 'correct') return this.store.answers[ex.id] || '';\n    if (ex.type === 'reorder') return (this.store.reorder[ex.id] || []).join(' ');\n    const arr = this.store.answers[ex.id];\n    return Array.isArray(arr) ? arr : [];\n  }\n\n  isCorrect(ex) {\n    if (ex.type === 'mc') return this.store.answers[ex.id] === ex.answer;\n    if (ex.type === 'correct' || ex.type === 'reorder') {\n      const user = norm(this.getUserAnswer(ex));\n      return ex.answers.some(a => norm(a) === user);\n    }\n    const arr = this.getUserAnswer(ex);\n    return ex.answers.every((a, i) => norm(arr[i] || '') === norm(a));\n  }\n\n  checkExercise(card, ex) {\n    const correct = this.isCorrect(ex);\n    this.markResult(ex.id, correct);\n    if (ex.type === 'mc') this.paintMCResult(card, ex, correct, this.store.answers[ex.id]);\n    else this.paintFillResult(card, ex, correct);\n    this.showFeedback(card, ex, correct);\n  }\n\n  showFeedback(card, ex, correct) {\n    const fb = card.querySelector('.gb-feedback');\n    fb.innerHTML =\n      '<div style=\"font-weight:700;color:' + (correct ? '#2E7D32' : '#C62828') + ';margin-bottom:4px;\">' + (correct ? 'Correct' : 'Pas tout à fait') + '<\u002Fdiv>' +\n      '<div style=\"color:#2B2B2B;opacity:0.9;\">' + ex.explain + '<\u002Fdiv>';\n  }\n\n  revealExercise(card, ex) {\n    const fb = card.querySelector('.gb-feedback');\n    let answerText = '';\n    if (ex.type === 'mc') answerText = ex.answer;\n    else if (ex.type === 'correct' || ex.type === 'reorder') answerText = ex.answers[0];\n    else answerText = ex.answers.join(' / ');\n    fb.innerHTML =\n      '<div style=\"font-weight:700;color:#0E7C86;margin-bottom:4px;\">Réponse : ' + answerText + '<\u002Fdiv>' +\n      '<div style=\"color:#2B2B2B;opacity:0.9;\">' + ex.explain + '<\u002Fdiv>';\n  }\n\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
