<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micha – Language Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/student.css">
<style>
  :root {
    --accent: #5b8fa8;
    --accent-light: #ddeef5;
  }
</style>
</head>
<body>
<div class="top-bar"></div>
<div class="page">

  <header>
    <p class="eyebrow">Language Studio · Durim</p>
    <h1>Hi, <em>Micha</em>.</h1>
    <div class="divider"></div>
    <p class="tagline">Your English lessons, ready when you are.</p>
  </header>

  <div class="hub-section">
    <p class="lessons-label">Your lessons</p>
    <div id="lesson-hero">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
    <div class="carousel-wrap" id="lesson-carousel">
      <button class="car-arrow car-prev" aria-label="Scroll left">‹</button>
      <div class="car-track"></div>
      <button class="car-arrow car-next" aria-label="Scroll right">›</button>
    </div>
    <a class="see-all" id="lesson-see-all">See all lessons →</a>
  </div>

  <div class="hub-section">
    <p class="lessons-label">Your grammar book</p>
    <div id="grammar-hero">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
    <div class="carousel-wrap" id="grammar-carousel">
      <button class="car-arrow car-prev" aria-label="Scroll left">‹</button>
      <div class="car-track"></div>
      <button class="car-arrow car-next" aria-label="Scroll right">›</button>
    </div>
    <a class="see-all" id="grammar-see-all">See full grammar book →</a>
  </div>

  <div class="hub-section">
    <p class="lessons-label">Your homework</p>
    <div id="homework-hero">
      <div class="loading-state"><div class="spinner"></div> Loading…</div>
    </div>
    <div class="carousel-wrap" id="homework-carousel">
      <button class="car-arrow car-prev" aria-label="Scroll left">‹</button>
      <div class="car-track"></div>
      <button class="car-arrow car-next" aria-label="Scroll right">›</button>
    </div>
    <a class="see-all" id="homework-see-all">See all homework →</a>
  </div>

  <div class="footer-note">Made with care by Durim · Open each lesson directly in your browser</div>

</div>

<script src="../assets/student.js" data-folder="Micha"></script>
</body>
</html>
